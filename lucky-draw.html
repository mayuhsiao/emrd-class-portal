<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>EMRD 年終宴會抽獎</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <!-- 線上字型（現場沒網路會自動改用系統字型，功能不受影響） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+TC:wght@500;700;900&family=Orbitron:wght@600;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="exchange">
  <!-- ===== 背景層 ===== -->
  <div class="bg-gradient"></div>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="wafer" aria-hidden="true"></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="spot l" aria-hidden="true"></div>
  <div class="spot r" aria-hidden="true"></div>

  <div id="app">
    <!-- ===== 頁首 ===== -->
    <header class="topbar">
      <div class="brand">
        <div class="logo-badge"><img src="assets/emrd-logo.png" alt="NTUST EMRD"></div>
        <img class="logo-ntust" src="assets/ntust-logo.png" alt="國立臺灣科技大學">
      </div>
      <div class="headline">
        <div class="tagline">✦ Year-End Banquet ✦</div>
        <h1 id="eventTitle" title="點兩下可以修改標題"></h1>
        <div class="sub">幸運大抽獎 <span>LUCKY DRAW</span></div>
      </div>
      <div class="tools">
        <a class="tool" href="index.html" title="回班級入口首頁">
          <span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10M10 19.5v-5h4v5"/></svg></span><em>首頁</em>
        </a>
        <button class="tool" id="btnPeople" type="button" title="學員名單：新增 / 刪除 / 修改"><span>👥</span><em>名單</em></button>
        <button class="tool" id="btnSound" type="button" title="音效開關（M）"><span>🔊</span><em>音效</em></button>
        <button class="tool" id="btnBgm" type="button" title="背景音樂開關（B）"><span>🎵</span><em>音樂</em></button>
        <button class="tool" id="btnVoice" type="button" title="開獎時用語音唸出名字"><span>🗣️</span><em>播報</em></button>
        <button class="tool" id="btnPanel" type="button" title="顯示 / 隱藏紀錄面板（P）"><span>📋</span><em>紀錄</em></button>
        <button class="tool" id="btnFull" type="button" title="全螢幕（F）">
          <span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span><em>全螢幕</em>
        </button>
      </div>
    </header>
    <div class="garland" id="garland" aria-hidden="true"></div>

    <main class="main">
      <!-- ===== 舞台 ===== -->
      <section class="stage-area">
        <div class="controls">
          <div class="seg mode-seg" role="tablist" aria-label="抽獎模式">
            <button type="button" data-mode="exchange">🎁 交換禮物</button>
            <button type="button" data-mode="prize">🏆 抽禮物</button>
          </div>
          <div class="seg count-seg" aria-label="一次抽幾人">
            <button type="button" data-count="1">抽 1 人</button>
            <button type="button" data-count="2">抽 2 人</button>
          </div>
          <div class="seg drawer-seg only-exchange" aria-label="抽獎人產生方式">
            <button type="button" data-drawer="random" title="每一輪由轉盤隨機抽出抽獎人">🎲 隨機抽獎人</button>
            <button type="button" data-drawer="chain" title="禮物被抽走的人，下一輪接著上台抽">🔗 接力</button>
          </div>
          <label class="prize-field only-prize">🏆
            <input id="prizeName" type="text" maxlength="24" placeholder="本輪獎項（選填，例：頭獎）" autocomplete="off">
          </label>
        </div>

        <div class="stage-frame" id="stageFrame">
          <div class="marquee" id="marquee" aria-hidden="true"></div>
          <div class="stage-ribbon" id="stageRibbon"></div>
          <div class="stage" id="stage"></div>
        </div>

        <div class="action">
          <div class="go-wrap">
            <button id="btnGo" class="go" type="button">
              <span class="go-label" id="goLabel">開始抽獎</span>
              <span class="go-key" id="goKey">SPACE · ENTER</span>
            </button>
          </div>
          <div class="status" id="status" aria-live="polite"></div>
        </div>
      </section>

      <!-- ===== 紀錄面板 ===== -->
      <aside class="panel" id="panel">
        <div class="panel-head">
          <div class="stats">
            <div class="stat"><b id="statA">0</b><span id="statALabel">已抽</span></div>
            <div class="stat"><b id="statB">0</b><span id="statBLabel">未抽</span></div>
            <div class="stat"><b id="statC">0</b><span>輪數</span></div>
          </div>
          <div class="tabs">
            <button type="button" class="tab on" data-tab="records">🏅 中獎紀錄</button>
            <button type="button" class="tab" data-tab="check">🔍 名單查核</button>
          </div>
        </div>
        <div class="panel-body">
          <ol class="record-list" id="recordList"></ol>
          <div class="check-view" id="checkView" hidden></div>
        </div>
        <div class="panel-foot">
          <button type="button" class="btn" id="btnUndo" title="撤銷最後一輪，這些人回到候選池">↶ 撤銷上一輪</button>
          <button type="button" class="btn" id="btnSummary" title="放大顯示全部結果">📜 總表</button>
          <button type="button" class="btn" id="btnExport" title="下載 Excel 可開啟的 CSV">⬇ 匯出 CSV</button>
          <button type="button" class="btn danger" id="btnReset" title="清除目前模式的所有紀錄">🗑 重置</button>
        </div>
      </aside>
    </main>

    <footer class="hotkeys">
      <span><kbd>Space</kbd><kbd>Enter</kbd><kbd>PgDn</kbd> 開始／停止（簡報筆可用）</span>
      <span><kbd>1</kbd><kbd>2</kbd> 抽幾人</span>
      <span><kbd>M</kbd> 音效</span>
      <span><kbd>B</kbd> 音樂</span>
      <span><kbd>F</kbd> 全螢幕</span>
      <span><kbd>P</kbd> 紀錄面板</span>
      <span><kbd>Esc</kbd> 關閉</span>
    </footer>
  </div>

  <!-- ===== 開獎慶祝 ===== -->
  <div class="celebrate" id="celebrate" aria-hidden="true"><div class="rays"></div><div class="rays r2"></div></div>
  <canvas id="fx-back" aria-hidden="true"></canvas>
  <div class="cele-wrap" id="celeWrap">
    <div class="cele-card" id="celeCard" role="dialog" aria-live="assertive">
      <button type="button" class="cele-x" id="celeClose" title="關閉（Esc）">✕</button>
      <div class="cele-ribbon"><span id="celeTitle">恭喜中獎</span></div>
      <div class="cele-sub" id="celeSub"></div>
      <div class="cele-list" id="celeList"></div>
      <div class="cele-next" id="celeNext"></div>
      <div class="cele-actions"><button type="button" class="btn primary big" id="celeNextBtn">▶ 下一輪</button></div>
      <div class="cele-hint">按 <kbd>Space</kbd> / <kbd>Enter</kbd> 直接開始下一輪 · <kbd>Esc</kbd> 關閉</div>
    </div>
  </div>
  <canvas id="fx-front" aria-hidden="true"></canvas>
  <div id="flash" aria-hidden="true"></div>

  <!-- ===== 名單管理 ===== -->
  <div class="modal" id="peopleModal">
    <div class="modal-card wide">
      <div class="modal-head">
        <h2>👥 學員名單 <small id="peopleCount"></small></h2>
        <button type="button" class="icon-btn" data-close title="關閉">✕</button>
      </div>
      <div class="modal-body">
        <div class="add-box">
          <textarea id="addNames" rows="2" placeholder="輸入姓名後按「新增」，可一次貼上多位（每行一位，或用逗號、頓號分隔）"></textarea>
          <button type="button" class="btn primary" id="btnAddNames">＋ 新增</button>
        </div>
        <div class="photo-tools">
          <button type="button" class="btn" id="btnImportPhotos">📷 匯入照片（可多選）</button>
          <span class="hint">檔名用姓名或編號，例如「林振川.jpg」「01.jpg」；也可以點頭像單獨上傳</span>
          <span class="spacer"></span>
          <span class="photo-count" id="photoCount"></span>
          <button type="button" class="btn danger" id="btnClearPhotos">清除匯入的照片</button>
          <input type="file" id="photoBulk" accept="image/*" multiple hidden>
          <input type="file" id="photoPick" accept="image/*" hidden>
        </div>
        <div class="people-tools">
          <input id="peopleSearch" type="search" placeholder="🔍 搜尋姓名或編號" autocomplete="off">
          <span class="legend">點名字可直接修改 · <i>🎁</i> 已抽禮物 · <i>📦</i> 禮物已被抽走 · <i>🏆</i> 已中獎</span>
        </div>
        <ul class="people-list" id="peopleList"></ul>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" id="btnRestoreDefault">↺ 恢復預設名單</button>
        <button type="button" class="btn danger" id="btnClearPeople">🗑 清空名單</button>
        <span class="spacer"></span>
        <button type="button" class="btn primary" data-close>完成</button>
      </div>
    </div>
  </div>

  <!-- ===== 總表 ===== -->
  <div class="modal" id="summaryModal">
    <div class="modal-card xwide">
      <div class="modal-head">
        <h2 id="summaryTitle">📜 總表</h2>
        <button type="button" class="icon-btn" data-close title="關閉">✕</button>
      </div>
      <div class="modal-body" id="summaryBody"></div>
    </div>
  </div>

  <!-- ===== 確認對話框 ===== -->
  <div class="modal" id="confirmModal">
    <div class="modal-card narrow">
      <div class="modal-head"><h2 id="confirmTitle"></h2></div>
      <div class="modal-body"><p class="confirm-msg" id="confirmMsg"></p></div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button type="button" class="btn" id="confirmCancel">取消</button>
        <button type="button" class="btn primary" id="confirmOk">確定</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/reel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
